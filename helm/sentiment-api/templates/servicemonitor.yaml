{{- if and .Values.monitoring.serviceMonitor.enabled (include "sentiment-api.hasPromOperator" .) }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "sentiment-api.fullname" . }}
  labels:
    {{- include "sentiment-api.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.releaseLabel }}
spec:
  selector:
    matchLabels:
      {{- include "sentiment-api.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
