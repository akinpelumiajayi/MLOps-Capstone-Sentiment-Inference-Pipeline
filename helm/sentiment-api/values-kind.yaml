# Overrides for a local kind cluster (see `make kind-deploy`).
image:
  repository: sentiment-api
  tag: local
  pullPolicy: Never   # image is side-loaded with `kind load docker-image`

hpa:
  minReplicas: 1
  maxReplicas: 4

resources:
  requests:
    cpu: 200m      # HPA % is relative to this; 50m produced misleading 500-2000% readings
    memory: 192Mi  # observed steady-state usage is ~145Mi
  limits:
    memory: 384Mi

topologySpread:
  enabled: false   # single-node cluster
