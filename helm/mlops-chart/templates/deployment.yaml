apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mlops-chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mlops-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mlops-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mlops-chart.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8000"
        prometheus.io/path:   "/metrics"
    spec:
      containers:
        # ── Main API container ────────────────────────────────────────────────
        - name: sentiment-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "mlops-chart.fullname" . }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

        # ── Optional Streamlit sidecar ────────────────────────────────────────
        {{- if .Values.streamlit.enabled }}
        - name: streamlit-dashboard
          image: {{ .Values.streamlit.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: streamlit
              containerPort: {{ .Values.streamlit.port }}
          env:
            - name: API_URL
              value: "http://localhost:8000"
        {{- end }}
